name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: Ops scripts (bash -n + shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every ops script
        run: |
          set -e
          for f in ops/*.sh setup.sh; do
            echo "bash -n $f"
            bash -n "$f"
          done
      - name: Lint (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck -S warning ops/*.sh setup.sh

  python:
    name: Ops python helpers (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile check
        run: python -m compileall -q ops

  compose:
    name: docker-compose.yml parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate YAML
        run: python -c "import yaml,sys; yaml.safe_load(open('docker-compose.yml')); print('compose OK')"
